name: Publish signed releases

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install -r src/requirements.txt -r src/requirements-release.txt -r src/requirements-test.txt
      - name: Run tests
        run: |
          python -m pytest -q tests
      - name: Compile application sources
        shell: pwsh
        run: |
          Get-ChildItem -Path src -Recurse -File -Filter *.py | ForEach-Object {
            python -m py_compile $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python -m py_compile install.py scripts/package_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install lint tools
        run: |
          python -m pip install -r src/requirements-test.txt
      - name: Run Ruff
        run: |
          python -m ruff check .
      - name: Run mypy
        run: |
          python -m mypy

  publish:
    needs: [test, lint]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install release tooling
        run: |
          python -m pip install packaging==26.2 sigstore==4.6.0
      - name: Build versioned source package
        id: package
        shell: pwsh
        run: |
          $output = python scripts/package_release.py --output-dir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = ($output | Where-Object { $_ -like "version=*" }) -replace "^version=", ""
          $tag = ($output | Where-Object { $_ -like "tag=*" }) -replace "^tag=", ""
          $archive = ($output | Where-Object { $_ -like "archive=*" }) -replace "^archive=", ""
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "archive=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Sign release artifact with Sigstore
        run: |
          sigstore sign --bundle "${{ steps.package.outputs.archive }}.sigstore.json" "${{ steps.package.outputs.archive }}"
      - name: Publish prerelease for main commit
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.package.outputs.tag }}" `
            "${{ steps.package.outputs.archive }}" `
            "${{ steps.package.outputs.archive }}.sha256" `
            "${{ steps.package.outputs.archive }}.sigstore.json" `
            --title "${{ steps.package.outputs.version }}" `
            --notes "Version: ${{ steps.package.outputs.version }}`nArtifact: $(Split-Path -Leaf '${{ steps.package.outputs.archive }}')`nSource commit: ${{ github.sha }}" `
            --target "${{ github.sha }}" `
            --prerelease
        shell: pwsh
      - name: Publish stable release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ steps.package.outputs.tag }}" `
            "${{ steps.package.outputs.archive }}" `
            "${{ steps.package.outputs.archive }}.sha256" `
            "${{ steps.package.outputs.archive }}.sigstore.json" `
            --title "${{ steps.package.outputs.version }}" `
            --notes "Version: ${{ steps.package.outputs.version }}`nArtifact: $(Split-Path -Leaf '${{ steps.package.outputs.archive }}')`nSource commit: ${{ github.sha }}" `
            --verify-tag
